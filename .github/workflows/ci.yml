# mcp-QUALITY-000001, mcp-QUALITY-000002: lint, format, types and the offline tests, on every push to development and every pull request.
name: CI

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

env:
  UV_VERSION: "0.11.26"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}  # so `uv run` keeps the matrix interpreter instead of .python-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uvx pyright --pythonpath .venv/bin/python
      - run: uv run pytest -q
