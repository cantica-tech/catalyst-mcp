[project]
name = "catalyst-mcp"
version = "0.1.0"
description = "An MCP server that keeps catalyst criteria in step with their git repositories: watchers, criteria, templates and users, every write authorized against the actor's identity"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Olivier Steck", email = "osteck@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "anyio>=4.5",
    "catalyst-users @ git+https://github.com/cantica-tech/catalyst-users@0.7.0",
    "jsonschema>=4.23",
    "mcp>=2.3,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "watchfiles>=1.0",
]

[project.scripts]
catalyst-mcp = "catalyst_mcp.server:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.16.10",  # the cantica-tech standard's pinned version (standards' Taskfile.standards.yml)
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (a Keycloak testcontainer); deselect with -m 'not integration'"]
